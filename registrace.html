<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Běh Javořími horami – Registrace</title>
  <link rel="icon" href="img/logo_2.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html {
      overflow-y: scroll;
    }

    body {
      font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      color: #f2f2f2;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .wrapper {
      flex: 1;
    }

    .logo {
      display: block;
      margin: 0 auto;
      width: 355px;
      height: auto;
      margin-top: 9px;
    }

    header {
      padding: 4px;
      text-align: center;
      background: #000000;
    }

    .logo-title {
      display: inline-block;
      text-decoration: none;
      transition: transform 0.3s ease;
    }

    .logo-title:hover {
      transform: scale(1.02);
    }

    header h1 {
      color: #8B5E3C;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 33px;
      font-weight: 750;
      letter-spacing: 0.7px;
      line-height: 1.15;
      margin: 15px 0 10px;
    }

    h2 {
      color: #c8c8c8;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.7px;
      line-height: 1.7;
    }

    p {
      color: #c8c8c8;
      font-family: "Trebuchet MS", sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.9px;
      line-height: 1.7;
    }

    header p {
      font-size: 16px;
      margin-top: 5px;
    }

    .nav-container {
      max-width: 720px;
      margin: 0 auto;
    }

    nav {
      background-color: #000000;
      border-radius: 12px;
      box-shadow: 0 2px 3px rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      margin: 0 auto;
    }

    nav ul {
      list-style-type: none;
      margin: 0;
      padding: 10px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    nav li a {
      color: #c8c8c8;
      font-family: "Trebuchet MS", sans-serif;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.7px;
      padding: 6px 12px;
      border-radius: 8px;
      position: relative;
      transition: all 0.3s ease;
    }

    nav li a::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 22px;
      height: 3px;
      background-color: #8B5E3C;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    nav li a:hover {
      color: #8B5E3C;
    }

    nav li a:hover::after {
      opacity: 1;
    }

    nav li a.active {
      color: #8B5E3C;
    }

    nav li a.active::after {
      opacity: 1;
    }

    main {
      max-width: 720px;
      margin: 20px auto;
      padding: 0 16px;
    }

    main a {
      color: #8B5E3C;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease-in-out;
    }

    main a:hover {
      border-bottom: 1px solid #8B5E3C;
      color: #b27a52;
    }

    .btn-outline {
      display: inline-block;
      background-color: #000000;
      color: #8B5E3C;
      padding: 14px 28px;
      font-size: 1.2em;
      font-weight: bold;
      text-decoration: none;
      border: 2px solid #8B5E3C;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-outline:hover {
      background-color: #8B5E3C;
      color: #f2f2f2;
    }

    .btn-center {
      text-align: center;
      margin: 30px 0;
    }

    footer {
      background-color: #8B5E3C;
      padding: 4px;
      text-align: center;
      font-size: 0.9em;
    }

    footer p {
      color: #f2f2f2;
    }

    /* Úpravy pro mobily */
    @media (max-width: 600px) {
      .header-inner {
        padding: 0 16px;
      }

      .logo {
        width: 100%;
        max-width: 280px;
      }

      header h1 {
        font-size: 1.6em;
        margin-top: 8px;
      }

      h2 {
        font-size: 1rem;
      }

      header p {
        font-size: 0.85em;
      }

      .nav-container {
        position: sticky;
        top: 0;
        z-index: 1000;
        max-width: 100%;
        margin: 0 auto;
        padding: 0 16px;
      }

      nav .menu {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 6px;
        border: 1.2px solid #ccc;
        border-radius: 10px;
        background-color: #000000;
        gap: 0;
      }

      .menu li {
        flex: 0 0 31%;
        box-sizing: border-box;
        text-align: center;
        list-style: none;
        padding-bottom: 3px;
      }

      .menu li a {
        display: inline-block;
        font-size: 0.9rem;
        padding: 6px 6px;
        text-decoration: none;
        color: #8B5E3C;
        white-space: nowrap;
        font-weight: 510;
        border-radius: 6px;
      }
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <header>
      <div class="header-inner">
        <img src="img/profil_black.svg" alt="Logo" class="logo">

        <a href="index.html" class="logo-title">
          <h1>Běh Javořími horami</h1>
        </a>

        <p>2027 | 16,5 km / 850 m převýšení</p>
      </div>
    </header>

    <div class="nav-container">
      <nav>
        <ul class="menu">
          <li><a href="index.html">o běhu</a></li>
          <li><a href="trasa.html">trasa</a></li>
          <li><a href="propozice.html">propozice</a></li>
          <li><a href="registrace.html" class="active">registrace</a></li>
          <li><a href="vysledky.html">výsledky</a></li>
          <li><a href="#">foto</a></li>
        </ul>
      </nav>
    </div>

    <main>
      <section>
        <h2>Registrace</h2>

        <p><strong>Přihlášky:</strong> ---</p>
        <p><strong>Startovné:</strong> ---</p>
      </section>

      <div class="btn-center">
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSeZdLGLn8UmlfpsfUkMxvNT7NTMf2YOW7s7Ng24_9Mi2HsIiA/viewform?usp=header"
          target="_blank"
          rel="noopener noreferrer"
          class="btn-outline"
        >Přihlásit se</a>
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2026 Běh Javořími horami</p>
  </footer>
</body>
</html>
